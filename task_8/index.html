<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <style>
        /* Сброс стилей и базовые настройки */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .open-btn { padding: 15px 30px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.3s; }
        .open-btn:hover { background-color: #0056b3; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; transform: translateY(-20px); transition: transform 0.3s ease; max-height: 95vh; overflow-y: auto; }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 1.5rem; color: #333; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .close-btn:hover { color: #333; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #007bff; outline: none; }
        
        .form-group input.error-input, .form-group textarea.error-input { border-color: #dc3545 !important; background-color: #fff8f8; }

        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; color: #666; }
        .checkbox-group input { margin-top: 3px; width: auto; }

        .submit-btn { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        .submit-btn:hover { background-color: #218838; }
        .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .message { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.9rem; display: none; }
        .message.success { background-color: #d4edda; color: #155724; display: block; }
        .message.error { background-color: #f8d7da; color: #721c24; display: block; }

        @media (max-width: 480px) {
            .modal-content { padding: 20px 15px; height: 100%; max-height: 100vh; border-radius: 0; display: flex; flex-direction: column; justify-content: center; }
            body { padding: 0; }
        }
    </style>
</head>
<body>

    <button class="open-btn" id="openModalBtn">Связаться с нами</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Обратная связь</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>

            <form id="feedbackForm" novalidate>
                <div class="form-group">
                    <label for="name">ФИО</label>
                    <input type="text" id="name" name="name" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00">
                </div>
                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input type="text" id="organization" name="organization" placeholder="ООО Ромашка">
                </div>
                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea id="message" name="message" rows="3" required placeholder="Ваше сообщение..."></textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <label for="agreement">Я согласен с политикой обработки персональных данных</label>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
                <div id="formMessage" class="message"></div>
            </form>
        </div>
    </div>

    <script>
        const ACCESS_KEY = '72c1acd9-dbae-4fb6-a1f7-dfc4d92950f9'; 
        const FORM_ENDPOINT = 'https://api.web3forms.com/submit';

        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const overlay = document.getElementById('modalOverlay');
        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('formMessage');

        function openForm() {
            overlay.classList.add('active');
            history.pushState({ modal: 'open' }, '', '#feedback-form');
            restoreFormData();
        }

        function closeForm() {
            overlay.classList.remove('active');
            if (window.location.hash === '#feedback-form') {
                history.pushState({ modal: 'closed' }, '', window.location.pathname + window.location.search);
            }
            messageDiv.className = 'message';
            messageDiv.textContent = '';
            document.querySelectorAll('.error-input').forEach(el => el.classList.remove('error-input'));
        }

        openBtn.addEventListener('click', openForm);
        closeBtn.addEventListener('click', closeForm);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeForm(); });

        window.addEventListener('popstate', () => {
            if (overlay.classList.contains('active')) closeForm();
            if (window.location.hash === '#feedback-form' && !overlay.classList.contains('active')) overlay.classList.add('active');
        });

        if (window.location.hash === '#feedback-form') openForm();

        const formInputs = form.querySelectorAll('input, textarea');
        formInputs.forEach(input => {
            input.addEventListener('input', () => {
                const data = {};
                formInputs.forEach(el => {
                    if (el.type === 'checkbox') data[el.name] = el.checked;
                    else data[el.name] = el.value;
                });
                localStorage.setItem('feedbackFormData', JSON.stringify(data));
                input.classList.remove('error-input');
            });
        });

        function restoreFormData() {
            const savedData = localStorage.getItem('feedbackFormData');
            if (savedData) {
                const data = JSON.parse(savedData);
                formInputs.forEach(el => {
                    if (data[el.name] !== undefined) {
                        if (el.type === 'checkbox') el.checked = data[el.name];
                        else el.value = data[el.name];
                    }
                });
            }
        }

        function validateName(name) {
            const regex = /^[a-zA-Zа-яА-ЯёЁ\s\-]{2,}$/;
            return regex.test(name);
        }

        function validatePhone(phone) {
            const cleanPhone = phone.replace(/[\s\-\(\)]/g, '');
            const regex = /^\+?\d{10,15}$/;
            return regex.test(cleanPhone);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 

            document.querySelectorAll('.error-input').forEach(el => el.classList.remove('error-input'));
            messageDiv.className = 'message';
            messageDiv.textContent = '';

            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            const agreementInput = document.getElementById('agreement');

            let hasError = false;
            let errorMsg = '';

            if (!validateName(nameInput.value.trim())) {
                nameInput.classList.add('error-input');
                hasError = true;
                errorMsg = 'В поле ФИО допускаются только буквы, пробелы и дефисы (мин. 2 символа).';
            } else if (!emailInput.checkValidity()) {
                emailInput.classList.add('error-input');
                hasError = true;
                errorMsg = 'Введите корректный Email.';
            } else if (!validatePhone(phoneInput.value.trim())) {
                phoneInput.classList.add('error-input');
                hasError = true;
                errorMsg = 'Телефон должен состоять из 10–15 цифр.';
            } else if (!agreementInput.checked) {
                hasError = true;
                errorMsg = 'Необходимо согласиться с политикой обработки данных.';
            }

            if (hasError) {
                messageDiv.textContent = errorMsg;
                messageDiv.classList.add('error');
                return; 
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            // Создаем FormData и добавляем ключ доступа
            const formData = new FormData(form);
            formData.append('access_key', ACCESS_KEY);

            try {
                const response = await fetch(FORM_ENDPOINT, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Ошибка при отправке');
                }
                messageDiv.textContent = 'Сообщение успешно отправлено!';
                messageDiv.classList.add('success');
                form.reset();
                localStorage.removeItem('feedbackFormData');
                setTimeout(() => closeForm(), 2000);

            } catch (error) {
                console.error('Детали ошибки:', error);
                messageDiv.textContent = 'Ошибка: ' + error.message;
                messageDiv.classList.add('error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить';
            }
        });
    </script>
</body>
</html>
